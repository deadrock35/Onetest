<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenTickets · Live events across South Africa</title>
    <meta
      name="description"
      content="OpenTickets is South Africa's premium ticketing platform. Book concerts, comedy, theatre and festivals in Johannesburg, Cape Town, Pretoria and beyond — instant e-tickets, reserved seating and secure ZAR payments."
    />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="OpenTickets (Pty) Ltd" />
    <link rel="canonical" href="https://opentickets.co.za/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#e3c07e" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenTickets" />
    <meta property="og:locale" content="en_ZA" />
    <meta property="og:url" content="https://opentickets.co.za/" />
    <meta property="og:title" content="OpenTickets · Live events across South Africa" />
    <meta
      property="og:description"
      content="Concerts, comedy, theatre and festivals across South Africa. Reserved seating, instant e-tickets and secure ZAR checkout."
    />
    <meta property="og:image" content="https://opentickets.co.za/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenTickets — live events across South Africa" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenTickets · Live events across South Africa" />
    <meta
      name="twitter:description"
      content="Concerts, comedy, theatre and festivals across South Africa. Reserved seating, instant e-tickets and secure ZAR checkout."
    />
    <meta name="twitter:image" content="https://opentickets.co.za/og-image.jpg" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="dns-prefetch" href="https://images.pexels.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; color: #f2f5fb; background: #0b0f19">

        <p>This ticketing platform needs JavaScript enabled. Please enable it or call 011 024 5678 to book.</p>

    </noscript>
    <script type="module" src="/src/main.tsx"></script>
